# Builds a version tag with build.yml — signed and notarized on macOS — and
# attaches the installers to a DRAFT GitHub release.
#
# Trigger by pushing a version tag (`v0.1.0`), or run it from the Actions tab with
# a tag that already exists. The draft's notes are generated from the pull
# requests merged since the previous version tag, grouped by .github/release.yml. Read the
# notes, check the assets and publish the release by hand: nothing here publishes.
#
# The build is build.yml itself, called with `sign: true`, so a release can never
# be built by steps other than the ones a manual build runs.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0). It must already exist; a draft release is created for it."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Without these the macOS build would come out unsigned and Gatekeeper would
      # refuse the .dmg people download. Checked before the draft exists, so a run
      # cannot leave a release holding a Windows installer and no usable macOS one.
      # Register them with scripts/setup-ci-signing-secrets.sh.
      - name: Verify the macOS signing secrets are registered
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                     APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!var:-}" ] || missing="$missing $var"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Register them with 'scripts/setup-ci-signing-secrets.sh path/to/DeveloperID.p12' and re-run." >&2
            exit 1
          fi

      # The generated notes are computed against the tag and the build checks it
      # out, so a manual run for a tag that does not exist stops here with a hint.
      - name: Verify the tag exists (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist. Create and push it first: git tag $TAG && git push origin $TAG" >&2
            exit 1
          fi

      # A bare `v0.1.0` would be resolved as a branch first if one had that name, so
      # the tag is checked out by its full ref and the build gets the resulting
      # commit — the tag itself could also move while the build runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Resolve the tag's commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The macOS bundle takes its version from wails.json's productVersion, so a tag
      # pushed without bumping it ships an app reporting the previous version.
      - name: Verify the versions match the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag is '$TAG'. A release tag must be vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          expected="${TAG#v}"
          fail=0
          for pair in "package.json:.version" "wails.json:.info.productVersion"; do
            file="${pair%%:*}"
            actual="$(jq -r "${pair#*:}" "$file")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$file declares version '$actual' but the tag is '$TAG'." >&2
              fail=1
            fi
          done
          exit "$fail"

      # Reuse a draft for this tag (a re-run after a failed build), but refuse a
      # published one: rebuilding it would replace the assets people have been
      # downloading. Releases are listed rather than looked up by tag because the
      # tag endpoint cannot see drafts.
      - name: Create (or reuse) the draft release with generated notes
        id: release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          published="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\" and (.draft | not)) | .id" | head -1)"
          if [ -n "$published" ]; then
            echo "::error::Release $TAG is already published (id $published). Tag a new version, or delete that release first if it went out by mistake." >&2
            exit 1
          fi
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -1)"
          if [ -z "$id" ]; then
            # Notes are generated first and passed as the body, because only the
            # generate-notes endpoint takes previous_tag_name. Left to itself GitHub
            # compares against the newest earlier release, and this repository also
            # releases model assets under other tags (ruri-v3-30m-q8_0-…): v0.1.0's
            # notes were cut against one and listed only the pull requests merged
            # since it. So name the version tag just below this one; with none (a
            # first release) GitHub's default stays.
            previous="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | { cat; echo "$TAG"; } | sort -uV \
              | grep -B1 -x "$TAG" | grep -vx "$TAG" || true)"
            notes_args=(-f tag_name="$TAG")
            if [ -n "$previous" ]; then
              notes_args+=(-f previous_tag_name="$previous")
              echo "Release notes compare $previous...$TAG"
            fi
            body="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${notes_args[@]}" --jq .body)"
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="SNZ Studio $TAG" \
              -f body="$body" \
              -F draft=true \
              -F prerelease=false \
              --jq .id)"
            echo "Created draft release $id for $TAG"
          else
            echo "Reusing draft release $id for $TAG"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      sign: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # Only the installers go on the release; the loose Windows files build.yml also
  # keeps (the portable fallback) stay in the run's artifacts. Assets are renamed
  # to carry the tag, since the built names do not.
  attach:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: snz-studio-*
          path: dist

      - name: Attach the installers to the draft release
        run: |
          set -euo pipefail
          dmg="$(find dist/snz-studio-macOS -maxdepth 1 -name '*.dmg' | head -1)"
          installer="$(find dist/snz-studio-Windows -maxdepth 1 -name '*-installer.exe' | head -1)"
          [ -n "$dmg" ] || { echo "::error::The macOS artifact holds no .dmg." >&2; exit 1; }
          [ -n "$installer" ] || { echo "::error::The Windows artifact holds no installer." >&2; exit 1; }
          mkdir out
          cp "$dmg" "out/SNZ-Studio-$TAG-macOS.dmg"
          cp "$installer" "out/SNZ-Studio-$TAG-Windows-amd64-installer.exe"
          (cd out && sha256sum -- * > SHA256SUMS.txt)
          ls -l out
          # Someone may have published the draft while the build ran; uploading
          # with --clobber would then replace assets already public.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)" != "true" ]; then
            echo "::error::Release $TAG was published during the build; not replacing its assets." >&2
            exit 1
          fi
          gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"

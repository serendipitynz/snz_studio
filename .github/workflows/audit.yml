# Fails when a dependency has a known vulnerability: `pnpm audit --prod` for what
# the SPA bundles, govulncheck for the Go binary.
#
# Kept apart from build.yml so it can run automatically: it takes seconds, uses no
# secrets, and needs nothing beyond a read-only checkout.
name: audit

# Advisories are published without any change to this repo, so a weekly run catches
# the ones that land between pushes; the PR and push runs catch a change that
# introduces one. Plain `pull_request` (never pull_request_target) gives a fork's PR
# a read-only token and no secrets.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

# Actions are pinned to commit SHAs, as in build.yml and release.yml, which hold
# the signing secrets: a moved tag there could read them. This workflow holds
# neither a secret nor a write token, but pins the same way so the three stay
# upgraded together.
jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from package.json's packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Reads pnpm-lock.yaml only, so no install is needed. devDependencies are left
      # out because none of them ship in the app; a dev-only advisory still shows in
      # a local `pnpm audit`.
      - name: pnpm audit --prod
        run: pnpm audit --prod

  govulncheck:
    name: govulncheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners for each shipped OS: Wails' darwin frontend is cgo-only,
        # so a cross-GOOS scan from Linux would drop those files and miss whatever
        # they reach.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck reports standard-library advisories against the Go it runs
      # under, so pin it to go.mod's `toolchain` — the version scripts/wails.mjs
      # builds the app with — rather than whatever setup-go resolved. The tags are
      # the ones `wails build` compiles the shipped binary with.
      - name: govulncheck
        shell: bash
        run: |
          set -euo pipefail
          export GOTOOLCHAIN="$(sed -n 's/^toolchain //p' go.mod)"
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags desktop,production ./...

# Builds the SNZ Studio desktop app for macOS and Windows.
#
# Cross-compilation is not possible (a macOS build needs CGO + the macOS SDK, and
# the WebView2 toolchain on Windows), so each OS is built on its own native runner
# via the matrix below.
#
# The macOS build is signed and notarized only when release.yml calls this
# workflow with `sign: true` and the APPLE_* secrets; a manual dispatch produces
# unsigned artifacts. Windows is never signed (no Authenticode certificate yet).
# Keeping one workflow for both is what keeps the release build and the manual
# build from drifting apart.
name: build

# Manual dispatch, or a call from release.yml. Not on push: this repo is public, so
# GitHub-hosted standard runners cost nothing and minutes are not the reason — a
# full matrix build takes tens of minutes and its unsigned artifacts are consumed by
# nobody automatically.
#
# The signing secrets reach this workflow through workflow_call. No fork-reachable
# trigger (pull_request_target and friends) may be added, or a fork's PR could
# read them.
on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      # The commit to build. release.yml passes the commit its tag resolved to, so
      # a manual release run cannot build a different commit than the tag names;
      # empty builds the triggering ref, as a manual dispatch does.
      ref:
        type: string
        default: ""
      sign:
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            platform: darwin/universal
          - name: Windows (amd64)
            os: windows-latest
            platform: windows/amd64

    steps:
      # Actions are pinned to commit SHAs because this workflow can hold the signing
      # secrets (see audit.yml for the same rule); the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.3

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # wails.json's frontend:install (`pnpm -C .. install`) never runs: Wails
      # skips installation outright when there is no package.json in frontend:dir
      # (NpmInstallUsingCommand returns early), and this repo keeps a single
      # package.json at the root. It still prints "Installing frontend
      # dependencies: Done.", so the skip is invisible — locally it goes unnoticed
      # because a developer's root node_modules already exists. CI starts from a
      # bare checkout, so the install has to be explicit here.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Put GOPATH bin on PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The CLI embeds the x/tools that parses this project during binding
      # generation, so its version is coupled to go.mod's `toolchain` pin — bump
      # both together (see the comment on that directive in go.mod).
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # NSIS provides makensis, which `wails build -nsis` invokes to produce the
      # Windows installer. Chocolatey puts it on the machine PATH, which the
      # already-running runner process never picks up, so the install directory
      # has to go on GITHUB_PATH for the later build step to resolve makensis —
      # without it Wails only warns ("Cannot create installer: makensis not
      # found") and still exits 0, leaving a green job with no installer.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      # `wails build` runs the frontend build itself (wails.json frontend:build),
      # against the node_modules the install step above produced.
      # scripts/wails.mjs is the same launcher the local `pnpm build:app` uses: it
      # pins GOTOOLCHAIN to go.mod's `toolchain` value, which the directive alone
      # cannot do (it is a floor, so a newer Go on the runner would be used as-is
      # and could emit export data the CLI's embedded x/tools cannot read).
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: node scripts/wails.mjs build -platform darwin/universal -clean

      # Stage the built-in embedding stack into the .app Resources before packaging:
      # the sidecar (llama-server) and the model GGUF the app seeds on first launch.
      # The official prebuilt binary runs the ruri GGUF unmodified; scripts/sidecar.mjs
      # pins its release, checks the archive's sha256, and keeps only llama-server and
      # its dylibs (extra unsigned exes fail notarization). The GGUF is the verified
      # release asset pinned in internal/embed/modelspec.go.
      # NOTE: ships the arm64 sidecar; a universal sidecar needs lipo of both arches'
      # binary + dylibs (TODO), so built-in embedding does not start on an Intel Mac.
      - name: Stage built-in embedding (macOS)
        if: runner.os == 'macOS'
        run: pnpm sidecar --app --arch arm64

      # TinySegmenter's modified BSD requires its notice to accompany a binary
      # redistribution, so the notices ride inside the .app rather than only in
      # the repo. Staged before signing, as scripts/build-mac-signed.sh does: like
      # the GGUF they are data files the .app's signature seals.
      - name: Stage license notices (macOS)
        if: runner.os == 'macOS'
        run: cp LICENSE THIRD_PARTY_NOTICES.md "build/bin/snz-studio.app/Contents/Resources/"

      # A temporary keychain holds the Developer ID certificate for this job only;
      # the partition list lets codesign use the key without a GUI prompt.
      - name: Import the signing certificate (macOS)
        if: runner.os == 'macOS' && inputs.sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # The order and flags are build-mac-signed.sh's, the recipe notarization has
      # accepted: the sidecar's dylibs, then llama-server with the JIT entitlements,
      # then the .app without them — inner code first, never --deep. Signed before
      # the smoke test below, so the test runs the binaries that ship.
      - name: Sign the sidecar and the app (macOS)
        if: runner.os == 'macOS' && inputs.sign
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          app=build/bin/snz-studio.app
          res="$app/Contents/Resources"
          find "$res" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' lib; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$lib"
          done
          codesign --force --options runtime --timestamp --entitlements build/darwin/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" "$res/llama-server"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"

      # Launch the built app on an empty data dir with every proxied request sent to a
      # closed port, so a model download cannot succeed (loopback is never proxied, so
      # the app still reaches its sidecar). The sidecar only stays up once the app's
      # probe embedding passes, so a llama-server still answering /health a few seconds
      # later means built-in embedding came up from the bundled files alone.
      - name: Smoke-test built-in embedding without the network (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/build/bin/snz-studio.app"
          exe="$(find "$app/Contents/MacOS" -type f -perm -u+x | head -1)"
          data="$RUNNER_TEMP/embed-smoke"
          mkdir -p "$data"
          DATA_DIR="$data" HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 \
            "$exe" > "$RUNNER_TEMP/embed-smoke.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true; pkill -f "$app/Contents/Resources/llama-server" || true' EXIT
          health() {
            # Anchored: the /bin/sh parent-watch wrapper (internal/embed/sidecar_unix.go)
            # carries the same path in its arguments but listens on nothing.
            pid="$(pgrep -f "^$app/Contents/Resources/llama-server" | head -1 || true)"
            [ -n "$pid" ] || return 1
            port="$(lsof -a -p "$pid" -iTCP -sTCP:LISTEN -Fn 2>/dev/null | sed -n 's/^n.*://p' | head -1)"
            [ -n "$port" ] && curl -fsS "http://127.0.0.1:$port/health" > /dev/null
          }
          for _ in $(seq 60); do health && break; sleep 2; done
          health || { cat "$RUNNER_TEMP/embed-smoke.log"; echo "the sidecar never answered /health"; exit 1; }
          first="$pid"
          sleep 5
          health && [ "$pid" = "$first" ] || { echo "the sidecar did not stay up"; exit 1; }
          ls -la "$data/models"
          echo "2a6cb2d9889140cd214bc4eaee14114f276a52afcf0a2fe65fae3d467f7480fe  $data/models/ruri-v3-30m-q8_0.gguf" | shasum -a 256 -c

      # An update replaces the installed .app with the one in the update archive, so
      # the .app itself has to carry a stapled ticket: the one stapled to the .dmg
      # never reaches it. notarytool takes a zip rather than a bundle; the zip only
      # carries the submission, and the ticket is stapled onto the .app.
      - name: Notarize and staple the .app (macOS)
        if: runner.os == 'macOS' && inputs.sign
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app=build/bin/snz-studio.app
          submission="$RUNNER_TEMP/snz-studio-notarize.zip"
          ditto -c -k --keepParent "$app" "$submission"
          scripts/ci-notarize.sh "$submission"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

      # The macOS update file, which release.yml signs and lists in latest.json.
      # ditto keeps the bundle's symlinks and extended attributes, which a plain zip
      # would drop, breaking the seal of the signature.
      - name: Package the update archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/snz-studio.app build/bin/SNZ-Studio.app.zip

      # Checked the way an update uses it: extracted, then assessed by Gatekeeper.
      - name: Verify the update archive passes Gatekeeper (macOS)
        if: runner.os == 'macOS' && inputs.sign
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/update-check"
          ditto -x -k build/bin/SNZ-Studio.app.zip "$check"
          xcrun stapler validate "$check/snz-studio.app"
          spctl --assess --type execute --verbose=2 "$check/snz-studio.app"

      # The volume holds the .app beside a symlink to /Applications, which Finder
      # shows as the drag-to-install target — the same layout build-mac-signed.sh
      # makes. ditto keeps the bundle's signature, and on a signed build the ticket
      # stapled above, intact.
      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          ditto build/bin/snz-studio.app "$stage/snz-studio.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "SNZ Studio" -srcfolder "$stage" -ov -format UDZO build/bin/SNZ-Studio.dmg

      # spctl is the Gatekeeper check a downloaded .dmg goes through.
      - name: Sign, notarize and staple the .dmg (macOS)
        if: runner.os == 'macOS' && inputs.sign
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg=build/bin/SNZ-Studio.dmg
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          scripts/ci-notarize.sh "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"

      # The installer takes the sidecar and the GGUF from where this leaves them
      # (build/sidecar/windows-amd64/ and build/sidecar/.downloads/), so it runs before
      # `wails build`, whose makensis step reads them and whose -clean leaves them be.
      - name: Stage built-in embedding for the installer (Windows)
        if: runner.os == 'Windows'
        run: pnpm sidecar --arch amd64

      - name: Build (Windows)
        if: runner.os == 'Windows'
        # -webview2 download ships the Evergreen bootstrapper so the installer can
        # fetch the WebView2 runtime at install time when it is absent.
        run: node scripts/wails.mjs build -platform windows/amd64 -nsis -webview2 download -clean

      # `wails build -nsis` downgrades a missing makensis to a warning, so the
      # only thing that distinguishes "installer built" from "installer silently
      # skipped" is the file itself. Assert it, or the job goes green while the
      # artifact recipients actually install from is absent.
      - name: Verify the NSIS installer was produced (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ls build/bin/*-installer.exe

      # The File directives in build/windows/installer/project.nsi are the only thing
      # putting the notices inside the installer, and nothing else in the build would
      # fail if they stopped resolving. Install silently into a scratch directory and
      # assert both files landed, so a template that quietly stops shipping them breaks
      # the build rather than the license obligation.
      - name: Verify the installer ships the license notices (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem build/bin/*-installer.exe | Select-Object -First 1).FullName
          $dest = Join-Path $env:RUNNER_TEMP 'installed-check'
          # /D= has to come last and stay unquoted: NSIS takes the rest of the line verbatim.
          $p = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          Get-ChildItem $dest
          foreach ($f in 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'llama-server.exe', 'ggml.dll', 'llama.dll', 'ruri-v3-30m-q8_0.gguf') {
            if (-not (Test-Path (Join-Path $dest $f))) { throw "$f is missing from the installed directory" }
          }

      # The installer is per user (build/windows/installer/project.nsi), which is what lets
      # the in-app updater run it without an administrator. The runner's account is an
      # administrator, so no prompt would show here either way; what can be asserted is
      # what decides it: a manifest that runs the installer as the invoking user, the
      # default directory under %LOCALAPPDATA%, and an uninstall entry under HKCU only.
      # Then /UPDATE, the updater's flag, must start the installed app afterwards.
      - name: Verify the installer installs per user and relaunches on update (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem build/bin/*-installer.exe | Select-Object -First 1).FullName
          $manifest = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($installer))
          if (-not $manifest.Contains('level="asInvoker"')) { throw "the installer's manifest does not run it as the invoking user" }

          $p = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\SNZ Studio'
          if (-not (Test-Path (Join-Path $dir 'uninstall.exe'))) { throw "nothing was installed under $dir" }
          $key = 'Software\Microsoft\Windows\CurrentVersion\Uninstall\SNZ StudioSNZ Studio'
          if (-not (Test-Path "HKCU:\$key")) { throw "no uninstall entry under HKCU" }
          if (Test-Path "HKLM:\$key") { throw "an uninstall entry was written under HKLM" }
          if (Get-Process | Where-Object { $_.Path -like "$dir\*" }) { throw "a plain silent install started the app" }

          # Not -Wait: it waits for the process's descendants too, and the app the
          # installer starts never exits on its own.
          $dest = Join-Path $env:RUNNER_TEMP 'update-check'
          $p = Start-Process -FilePath $installer -ArgumentList '/S', '/UPDATE', "/D=$dest" -PassThru
          $null = $p.Handle # without an open handle, ExitCode reads as empty after the exit
          if (-not $p.WaitForExit(300000)) { throw "the installer did not finish within 5 minutes under /UPDATE" }
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode) under /UPDATE" }
          $started = $null
          for ($i = 0; $i -lt 30 -and -not $started; $i++) {
            Start-Sleep -Milliseconds 500
            $started = Get-Process | Where-Object { $_.Path -like "$dest\*" -and $_.Name -ne 'llama-server' }
          }
          if (-not $started) { throw "the installer did not start the app after an /UPDATE install" }
          Get-Process | Where-Object { $_.Path -like "$dest\*" } | Stop-Process -Force

      # Same check as the macOS smoke test, against the installed copy: an empty data
      # dir, proxied requests sent to a closed port, and a sidecar that must still
      # answer /health a few seconds after it first does.
      - name: Smoke-test built-in embedding without the network (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'installed-check'
          $data = Join-Path $env:RUNNER_TEMP 'embed-smoke'
          $exe = Get-ChildItem $dest -Filter '*.exe' | Where-Object { $_.Name -notin 'llama-server.exe', 'uninstall.exe' } | Select-Object -First 1
          # Set only for the app's launch: the child takes a copy, and the checks below
          # must not go through the dead proxy themselves.
          $env:DATA_DIR = $data; $env:HTTPS_PROXY = 'http://127.0.0.1:9'; $env:HTTP_PROXY = 'http://127.0.0.1:9'
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Remove-Item Env:DATA_DIR, Env:HTTPS_PROXY, Env:HTTP_PROXY
          function Get-Health {
            $srv = Get-Process llama-server -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$dest*" } | Select-Object -First 1
            if (-not $srv) { return $null }
            $port = (Get-NetTCPConnection -OwningProcess $srv.Id -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1).LocalPort
            if (-not $port) { return $null }
            try { Invoke-WebRequest "http://127.0.0.1:$port/health" -UseBasicParsing -NoProxy | Out-Null } catch { return $null }
            return $srv.Id
          }
          try {
            $first = $null
            for ($i = 0; $i -lt 60 -and -not $first; $i++) { Start-Sleep 2; $first = Get-Health }
            if (-not $first) { throw 'the sidecar never answered /health' }
            Start-Sleep 5
            if ((Get-Health) -ne $first) { throw 'the sidecar did not stay up' }
            Get-ChildItem (Join-Path $data 'models')
            $hash = (Get-FileHash (Join-Path $data 'models\ruri-v3-30m-q8_0.gguf') -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne '2a6cb2d9889140cd214bc4eaee14114f276a52afcf0a2fe65fae3d467f7480fe') { throw "seeded GGUF has sha256 $hash" }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Get-Process llama-server -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      # The same files loose beside the app exe, for the portable fallback: someone who
      # takes the artifact zip without running the installer still gets built-in
      # embedding. Authenticode-sign the sidecar with the app (signing TODO below).
      - name: Stage built-in embedding beside the exe (Windows)
        if: runner.os == 'Windows'
        run: pnpm sidecar --app

      # Same obligation as the macOS step above. The installer carries its own copies
      # now (build/windows/installer/project.nsi), so these cover the portable fallback:
      # the loose sidecar exe and DLLs are a binary redistribution of their own, and
      # someone who takes the artifact zip without running the installer still needs them.
      - name: Stage license notices (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp LICENSE THIRD_PARTY_NOTICES.md build/bin/

      # --- Windows signing (TODO: needs a code-signing certificate) ---------------
      #   - signtool sign /fd sha256 /tr <timestamp> /td sha256 the installer with
      #     the code-signing cert, guarded on `inputs.sign` like the macOS steps.
      #   Secrets: WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snz-studio-${{ runner.os }}
          path: |
            build/bin/*.dmg
            build/bin/*.app.zip
            build/bin/*.exe
            build/bin/*.dll
            build/bin/*.gguf
            build/bin/LICENSE
            build/bin/THIRD_PARTY_NOTICES.md
          if-no-files-found: warn

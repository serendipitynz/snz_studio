# Builds the SNZ Studio desktop app for macOS and Windows.
#
# Cross-compilation is not possible (a macOS build needs CGO + the macOS SDK, and
# the WebView2 toolchain on Windows), so each OS is built on its own native runner
# via the matrix below.
#
# Code signing and notarization are intentionally NOT wired up yet — they require
# user-provided certificates/secrets. The unsigned artifacts build and upload
# today; the signing steps are documented inline and guarded on secrets so they
# activate without changing the build once those secrets exist.
name: build

# Manual-only trigger: this repo is public, so GitHub-hosted standard runners cost
# nothing and minutes are not the reason. A full matrix build takes tens of minutes
# and produces unsigned artifacts nobody consumes automatically, so it runs only on
# an explicit dispatch from the Actions tab — never automatically on a push or tag.
#
# Keep it that way when signing secrets land: no fork-reachable trigger
# (pull_request_target and friends) may be added, or a fork's PR could read them.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            platform: darwin/universal
          - name: Windows (amd64)
            os: windows-latest
            platform: windows/amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # wails.json's frontend:install (`pnpm -C .. install`) never runs: Wails
      # skips installation outright when there is no package.json in frontend:dir
      # (NpmInstallUsingCommand returns early), and this repo keeps a single
      # package.json at the root. It still prints "Installing frontend
      # dependencies: Done.", so the skip is invisible — locally it goes unnoticed
      # because a developer's root node_modules already exists. CI starts from a
      # bare checkout, so the install has to be explicit here.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Put GOPATH bin on PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The CLI embeds the x/tools that parses this project during binding
      # generation, so its version is coupled to go.mod's `toolchain` pin — bump
      # both together (see the comment on that directive in go.mod).
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # NSIS provides makensis, which `wails build -nsis` invokes to produce the
      # Windows installer. Chocolatey puts it on the machine PATH, which the
      # already-running runner process never picks up, so the install directory
      # has to go on GITHUB_PATH for the later build step to resolve makensis —
      # without it Wails only warns ("Cannot create installer: makensis not
      # found") and still exits 0, leaving a green job with no installer.
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      # `wails build` runs the frontend build itself (wails.json frontend:build),
      # against the node_modules the install step above produced.
      # scripts/wails.mjs is the same launcher the local `pnpm build:app` uses: it
      # pins GOTOOLCHAIN to go.mod's `toolchain` value, which the directive alone
      # cannot do (it is a floor, so a newer Go on the runner would be used as-is
      # and could emit export data the CLI's embedded x/tools cannot read).
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: node scripts/wails.mjs build -platform darwin/universal -clean

      # Stage the bundled embedding sidecar (llama-server) into the .app Resources
      # before packaging. The official prebuilt binary runs the ruri GGUF unmodified.
      # NOTE: ships the arm64 sidecar; a universal sidecar needs lipo of both arches'
      # binary + dylibs (TODO). Signing the sidecar is part of the notarization TODO
      # below; scripts/build-mac-signed.sh is the verified local recipe.
      - name: Stage embedding sidecar (macOS)
        if: runner.os == 'macOS'
        env:
          LLAMA_RELEASE: b9437
        run: |
          set -euo pipefail
          RES="build/bin/snz-studio.app/Contents/Resources"
          curl -fsSL "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_RELEASE}/llama-${LLAMA_RELEASE}-bin-macos-arm64.tar.gz" -o /tmp/sc.tar.gz
          mkdir -p /tmp/sc && tar xzf /tmp/sc.tar.gz -C /tmp/sc
          SRC="$(dirname "$(find /tmp/sc -name llama-server -type f | head -1)")"
          # Keep only llama-server among executables (extra unsigned exes fail notarization).
          for f in "$SRC"/*; do b="$(basename "$f")"; if [[ -f "$f" && "$b" != llama-server && "$b" != *.dylib ]] && file "$f" | grep -q "Mach-O.*executable"; then rm -f "$f"; fi; done
          cp -R "$SRC"/. "$RES"/

      # TinySegmenter's modified BSD requires its notice to accompany a binary
      # redistribution, so the notices ride inside the .app rather than only in
      # the repo. scripts/build-mac-signed.sh stages them at the same point.
      - name: Stage license notices (macOS)
        if: runner.os == 'macOS'
        run: cp LICENSE THIRD_PARTY_NOTICES.md "build/bin/snz-studio.app/Contents/Resources/"

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create \
            -volname "SNZ Studio" \
            -srcfolder "build/bin/snz-studio.app" \
            -ov -format UDZO \
            "build/bin/SNZ-Studio.dmg"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        # -webview2 download ships the Evergreen bootstrapper so the installer can
        # fetch the WebView2 runtime at install time when it is absent.
        run: node scripts/wails.mjs build -platform windows/amd64 -nsis -webview2 download -clean

      # `wails build -nsis` downgrades a missing makensis to a warning, so the
      # only thing that distinguishes "installer built" from "installer silently
      # skipped" is the file itself. Assert it, or the job goes green while the
      # artifact recipients actually install from is absent.
      - name: Verify the NSIS installer was produced (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ls build/bin/*-installer.exe

      # Stage the Windows embedding sidecar (CPU build): llama-server.exe + ggml/llama
      # DLLs next to the app exe. TODO: bundling these INTO the NSIS installer needs
      # build/windows/installer template changes (File directives); until then the
      # loose files are uploaded as a portable fallback. Authenticode-sign the sidecar
      # with the app (signing TODO below).
      - name: Stage embedding sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          LLAMA_RELEASE: b9437
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_RELEASE}/llama-${LLAMA_RELEASE}-bin-win-cpu-x64.zip" -o /tmp/sc.zip
          mkdir -p /tmp/sc && unzip -q /tmp/sc.zip -d /tmp/sc
          SRC="$(dirname "$(find /tmp/sc -name llama-server.exe | head -1)")"
          cp "$SRC/llama-server.exe" build/bin/
          find "$SRC" -name '*.dll' -exec cp {} build/bin/ \;

      # Same obligation as the macOS step above. Folding these into the NSIS
      # installer itself needs the build/windows/installer template changes the
      # sidecar step already defers, so until then they ship beside the exe and
      # reach a recipient through the artifact zip (TASK-26).
      - name: Stage license notices (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp LICENSE THIRD_PARTY_NOTICES.md build/bin/

      # --- Signing & notarization (TODO: needs user-provided secrets) -----------
      #
      # macOS (Developer ID):
      #   - Import the Developer ID Application cert from a base64 .p12 secret into
      #     a temporary keychain.
      #   - Sign the staged sidecar FIRST (do not rely on --deep): each
      #     Contents/Resources/*.dylib with --options runtime --timestamp, then
      #     Contents/Resources/llama-server additionally with
      #     --entitlements build/darwin/entitlements.plist; then sign the .app.
      #     scripts/build-mac-signed.sh is the verified local implementation.
      #   - Re-create the .dmg and submit it with `xcrun notarytool submit --wait`,
      #     then `xcrun stapler staple` the .dmg.
      #   Secrets: APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD, APPLE_DEVELOPER_ID,
      #            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      #
      # Windows (Authenticode):
      #   - signtool sign /fd sha256 /tr <timestamp> /td sha256 the installer with
      #     the code-signing cert.
      #   Secrets: WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD
      #
      # Each signing step should be guarded like:
      #   if: runner.os == 'macOS' && secrets.APPLE_CERT_P12_BASE64 != ''
      # so the workflow keeps producing unsigned builds until the secrets land.

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snz-studio-${{ runner.os }}
          path: |
            build/bin/*.dmg
            build/bin/*.exe
            build/bin/LICENSE
            build/bin/THIRD_PARTY_NOTICES.md
          if-no-files-found: warn
